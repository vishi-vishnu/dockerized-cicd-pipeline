# Opens pull requests every Monday when something can be updated. CI tests each one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      dev-tools:
        dependency-type: development
    ignore:
      # TypeScript 7 is not supported by typescript-eslint yet
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Stay on the Node.js LTS line; odd versions are short-lived
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
      day: monday
